{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<div class="text-center py-5">
  <div class="display-4 fw-bold text-secondary">{{ codigo }}</div>
  <h1 class="h4">{{ titulo }}</h1>
  <p class="text-muted">{{ mensaje }}</p>
  <a href="{% url 'inicio' %}" class="btn btn-istam">Volver al inicio</a>
</div>
{% endblock %}
{% block publico %}
<div class="login-fondo"><div class="card p-4 text-center"><h1 class="h4">{{ titulo }}</h1><p>{{ mensaje }}</p>
<a href="{% url 'login' %}" class="btn btn-istam">Ingresar</a></div></div>
{% endblock %}
