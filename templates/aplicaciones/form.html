{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<div class="titulo-pagina"><h1>{{ titulo }}</h1>
  <a href="{% if app %}{% url 'aplicacion_detalle' app.pk %}{% else %}{% url 'aplicacion_lista' %}{% endif %}" class="btn btn-light"><i class="bi bi-arrow-left"></i> Volver</a></div>
<div class="card"><div class="card-body">
  <form method="post" novalidate>{% csrf_token %}
    {% include "includes/form.html" with form=form cols="col-md-6" %}
    <div class="mt-4 d-flex gap-2"><button class="btn btn-istam"><i class="bi bi-save"></i> Guardar</button>
      <a href="{% url 'aplicacion_lista' %}" class="btn btn-light">Cancelar</a></div>
  </form>
</div></div>
{% endblock %}
