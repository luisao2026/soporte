# Apache como proxy inverso hacia el contenedor (requiere: a2enmod proxy proxy_http headers ssl)
<VirtualHost *:443>
    ServerName soporte.istam.edu.ec

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:8082/
    ProxyPassReverse / http://127.0.0.1:8082/

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/soporte.istam.edu.ec/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/soporte.istam.edu.ec/privkey.pem
</VirtualHost>
